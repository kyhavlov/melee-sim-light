[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melee-sim-light"
version = "0.0.0"
description = "A deterministic, batched Melee simulator for reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/kyhavlov/melee-sim-light"
Issues = "https://github.com/kyhavlov/melee-sim-light/issues"

[dependency-groups]
dev = [
  "peppi-py",
  "pytest",
  "zstandard",
]

[tool.uv]
package = true
default-groups = []
