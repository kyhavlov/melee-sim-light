name: melee-core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and tooling-test dependencies
        run: python -m pip install uv pytest zstandard
      - name: Check source inventory
        run: make source-check
      - name: Build source distribution and platform wheel
        env:
          MAKEFLAGS: -j4
        run: uv build
      - name: Install and load the packaged native API outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -I -c 'from melee_sim import _native; _native.library()'
          python -I -m melee_sim.extract_data --help
      - name: Check replay storage tooling without downloading replays
        run: python -m pytest tests/test_slpz_replay_storage.py -q -k "not real_replay_payload"

  aggregate:
    # Only trusted main code receives the locally supplied game data.
    # Fork pull requests still run the package/build job above.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    # Pin the image that matches the validated environment (gcc-13). The
    # replay gate asserts bit-exactness, so keep the toolchain stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Replays are LFS objects (~222 MB). Cache them so runs don't burn the
      # LFS bandwidth quota; checkout above fetches pointers only.
      - name: Compute LFS asset manifest
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore cached LFS objects
        id: cache-lfs
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull --include="replays/validation/**" --exclude=""

      - name: Save LFS objects to cache
        if: steps.cache-lfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Keep only the current validation cache
        env:
          GH_TOKEN: ${{ github.token }}
          LFS_CACHE_KEY: lfs-${{ hashFiles('.lfs-assets-id') }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches' | jq -s 'add' > "$RUNNER_TEMP/msl-caches.json"
          # Never delete the previous cache unless the replacement is available.
          keep_id=$(jq -er --arg key "$LFS_CACHE_KEY" '
            [.[] | select(.key == $key and .ref == "refs/heads/main")]
            | max_by(.created_at) | .id // error("Current replay cache is missing")
          ' "$RUNNER_TEMP/msl-caches.json")
          jq -r --argjson keep "$keep_id" '
            .[] | select(.id != $keep and
              (.key | startswith("lfs-") or startswith("ssbm-iso-") or startswith("game-data-")))
            | .id
          ' "$RUNNER_TEMP/msl-caches.json" > "$RUNNER_TEMP/msl-old-caches.txt"
          while read -r cache_id; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done < "$RUNNER_TEMP/msl-old-caches.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install peppi-py==0.8.6 pyarrow numpy zstandard py-ubjson pytest

      # Do not place the ISO or extracted game data in Actions caches/artifacts:
      # fork PRs can read caches from the base branch of a public repository.
      - name: Download the locally supplied ISO
        env:
          SSBM_ISO_URL: ${{ secrets.SSBM_ISO_URL }}
        run: |
          if [ -z "$SSBM_ISO_URL" ]; then
            echo "::error::Set SSBM_ISO_URL to run the trusted replay gate."
            exit 1
          fi
          curl --fail --location --retry 3 --silent --show-error \
            "$SSBM_ISO_URL" -o SSBM.iso

      - name: Extract game data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m tools.data.extract --iso SSBM.iso --out-dir data

      - name: Build the native core and validator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: make native validator python-library -j4 PY=python3

      - name: Check source inventory
        run: make source-check

      - name: Run the aggregate replay gate
        # Explicit bash turns on pipefail so the tee cannot mask a gate
        # failure. The 8s native per-case default is calibrated for the
        # validated container; shared hosted runners can run several times
        # slower depending on region, so give each case timeout headroom
        # (correctness is frame comparison, never wall clock).
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m tools.validation.validate_replay \
            --suite replays/suites/melee_core_aggregate.json \
            --backend native --no-build --workers 4 \
            --timeout 30 \
            --output-locks replays/suites/melee_core_output_locks.json \
            | tee aggregate.log
          grep -E "^\[native\] summary" aggregate.log >> "$GITHUB_STEP_SUMMARY"

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        # This native-validation test asserts wall-clock and per-case timeout
        # budgets calibrated for the validated container; the 4-vCPU hosted
        # runner blows them (timed-out shared runners then desync and report
        # spurious protocol errors). The aggregate gate above already covers
        # every admitted replay end-to-end, so skip the timing test here.
        run: >
          python3 -m pytest tests -q
          --deselect tests/test_melee_core_validation.py::test_native_validation_runs_current_oracle_replays_in_parallel
