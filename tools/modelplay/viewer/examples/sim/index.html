<!DOCTYPE html>

<html>
  <head>
    <title>Modelplay Trace Viewer</title>
    <script type="text/javascript" src="../../dist/index.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
      }

      slippi-viewer {
        display: block;
        max-width: 980px;
        margin-top: 12px;
      }

      #status {
        margin-left: 12px;
      }

      .status-error {
        color: #b91c1c;
      }

      .status-ok {
        color: #166534;
      }
    </style>
  </head>

  <body>
    <label for="choose-trace">Choose modelplay trace JSON:</label>
    <input type="file" id="choose-trace" name="choose-trace" accept=".json,application/json" />
    <button onclick="clearViewer()">Clear viewer</button>
    <span id="status">Waiting for trace...</span>
    <slippi-viewer zips-base-url="/public"></slippi-viewer>

    <script>
      const viewer = document.querySelector("slippi-viewer");
      const input = document.querySelector("#choose-trace");
      const status = document.querySelector("#status");

      input.addEventListener("change", handleFileUpload);

      function clearViewer() {
        viewer.clear();
        setStatus("Viewer cleared.", "status-ok");
      }

      function setStatus(message, className = "") {
        status.textContent = message;
        status.className = className;
      }

      async function handleFileUpload() {
        const traceFile = input.files[0];
        if (!traceFile) return;
        setStatus(`Loading ${traceFile.name}...`);
        try {
          const replayData = JSON.parse(await traceFile.text());
          if (typeof viewer.setReplayData !== "function") {
            throw new Error("viewer.setReplayData is not available");
          }
          viewer.setReplayData(replayData);
          const frameCount = Array.isArray(replayData.frames) ? replayData.frames.length : 0;
          setStatus(`Loaded ${traceFile.name} (${frameCount} frames).`, "status-ok");
        } catch (error) {
          console.error(error);
          setStatus(`Failed to load trace: ${error.message}`, "status-error");
        }
      }
    </script>
  </body>
</html>
